name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint and types (py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        # Pinned so CI installs exactly the checked-in uv.lock.
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Lockfile matches pyproject
        run: uv lock --check

      - name: Install package
        run: uv sync --locked --extra dev

      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Ruff format
        run: uv run --no-sync ruff format --check .

      - name: Mypy
        run: uv run --no-sync mypy --strict src/


  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install package
        run: uv sync --locked --extra dev

      - name: Pytest
        run: >-
          uv run --no-sync pytest -m "not slow"
          --cov=starfold --cov-report=term --cov-fail-under=80

  slow-integration:
    # Real UMAP and HDBSCAN fits end to end on small fixtures.
    name: slow integration (py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install package
        run: uv sync --locked --extra dev

      - name: Pytest (slow markers only)
        run: uv run --no-sync pytest -m slow

  wheel:
    # Tests import from src/; only an isolated wheel install catches files left out of the package.
    name: wheel install (py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Build the wheel
        run: uv build --wheel

      - name: Install the wheel alone and run one recovery
        working-directory: ${{ runner.temp }}
        run: |
          uv venv smoke
          VIRTUAL_ENV=smoke uv pip install "${GITHUB_WORKSPACE}"/dist/*.whl
          VIRTUAL_ENV=smoke uv run --no-project python \
            "${GITHUB_WORKSPACE}/scripts/wheel_smoke.py"
