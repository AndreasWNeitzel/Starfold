[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "starfold"
version = "0.2.0"
description = "UMAP, HDBSCAN and Optuna population recovery with possible-world evidence and matched-null calibration."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [
    { name = "Andreas W. Neitzel", email = "andreaswneitzel@gmail.com" },
]
keywords = [
    "clustering",
    "unsupervised-learning",
    "manifold-learning",
    "umap",
    "hdbscan",
    "optuna",
    "consensus-clustering",
    "cluster-stability",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "umap-learn>=0.5.5",
    "hdbscan>=0.8.33",
    "optuna>=3.6",
    "joblib>=1.3",
    "pynndescent>=0.5",
]

[project.optional-dependencies]
gpu-cu12 = [
    "cuml-cu12>=25.12,<27",
]
gpu-cu13 = [
    "cuml-cu13>=25.12,<27",
]
bench = [
    # fetch_openml(parser="auto") reads dense ARFF through pandas.
    "pandas>=2.0",
    "matplotlib>=3.8",
    "jupytext>=1.16",
    "ipykernel>=6.29",
]
docs = [
    "sphinx>=8",
    "myst-parser>=4",
    "furo>=2024.8",
    "sphinx-design>=0.6",
    "sphinx-copybutton>=0.5",
    "numpydoc>=1.8",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=4.4",
]

[project.urls]
Homepage = "https://github.com/AndreasWNeitzel/starfold"
Repository = "https://github.com/AndreasWNeitzel/starfold"
Documentation = "https://andreaswneitzel.github.io/Starfold/"
Changelog = "https://github.com/AndreasWNeitzel/starfold/blob/main/CHANGELOG.md"
Issues = "https://github.com/AndreasWNeitzel/starfold/issues"
Paper = "https://doi.org/10.1051/0004-6361/202451718"

[tool.uv]
# cuml-cu12 and cuml-cu13 pin mutually exclusive cuda-toolkit major versions,
# so a single environment can only ever install one of the two GPU extras.
conflicts = [[{ extra = "gpu-cu12" }, { extra = "gpu-cu13" }]]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
starfold = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "bench"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    # `X` for feature matrices is the scientific-Python convention.
    "N803",
    "N806",
    # Small integer literals read better inline than behind a named constant.
    "PLR2004",
    # Keyword-only scientific APIs take several explicit controls.
    "PLR0913",
    "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ANN"]
"bench/**" = ["D", "ANN", "T201"]
"notebooks/**" = ["D", "ANN", "T201", "INP001", "E402", "B018", "ERA001"]
"scripts/**" = ["INP001"]
"docs/conf.py" = ["INP001"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "umap",
    "hdbscan",
    "cuml.*",
    "cupy.*",
    "rmm.*",
    "sklearn.*",
    "scipy.*",
    "joblib.*",
    "pynndescent",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: requires an importable cuML backend",
]

[tool.coverage.run]
source = ["src/starfold"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.jupytext]
formats = "ipynb,py:percent"
