minimum_pre_commit_version: "4.4.0"
exclude: ^legacy/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=5000"]

  # Ruff and mypy run from the locked environment, so their versions are the
  # ones in uv.lock and CI.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --fix --force-exclude
        language: unsupported
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format --force-exclude
        language: unsupported
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run --no-sync mypy
        language: unsupported
        pass_filenames: false
        files: ^src/
