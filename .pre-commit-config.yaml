repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=5000"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies:
          - numpy>=1.26
        args: ["--strict", "--ignore-missing-imports"]
        files: ^src/

  - repo: https://github.com/mwouts/jupytext
    rev: v1.16.4
    hooks:
      - id: jupytext
        args: ["--sync"]
        files: ^docs/tutorial_.*\.(ipynb|py)$

  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
        # Strip outputs from the legacy reference notebook only. The
        # four tutorial notebooks deliberately keep their rendered
        # outputs so GitHub's notebook viewer shows the full story; the
        # .py:percent pair (paired via jupytext above) is the
        # source-of-truth for code review.
        files: ^legacy/.*\.ipynb$
